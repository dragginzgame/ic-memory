# Keep PocketIC's host-only dependency graph out of the library's normal gates.
[workspace]
resolver = "3"
members = ["crates/ic-memory-runtime-qualification"]
default-members = ["crates/ic-memory-runtime-qualification"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"

[workspace.dependencies]
# Paired caller-owned server API; see ../../AGENTS.md#dependency-exceptions.
pocket-ic = "=16.0.0"
