<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc" data-diagram="validation-before-opening">
  <title id="title">ic-memory: the lifecycle in three steps</title>
  <desc id="desc">First, name each store. Second, remember its storage location. Third, before every upgrade opens data, compare the expected layout with the remembered layout. If they are the same, open safely. If they are different, stop and report the conflict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
    <marker id="safe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#218B70"/></marker>
    <marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C64535"/></marker>
  </defs>
  <rect width="1200" height="1010" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC MEMORY · HOW IT WORKS</text>
    <text x="56" y="107" font-size="34" font-weight="700">Three steps to check your storage layout</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Name it. Remember it. Check it before opening data.</text>

    <rect x="216" y="188" width="768" height="108" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <circle cx="272" cy="242" r="25" fill="#DDF6FA"/>
    <text x="272" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#087C94">1</text>
    <text x="320" y="251" font-size="26" font-weight="700">Name each store</text>

    <path d="M600 299V344" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="358" width="768" height="108" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <circle cx="272" cy="412" r="25" fill="#DDF6FA"/>
    <text x="272" y="420" text-anchor="middle" font-size="23" font-weight="700" fill="#087C94">2</text>
    <text x="320" y="421" font-size="26" font-weight="700">Remember its storage location</text>

    <path d="M600 469V514" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="528" width="768" height="170" rx="18" fill="white" stroke="#009DBD" stroke-width="2"/>
    <circle cx="272" cy="579" r="25" fill="#DDF6FA"/>
    <text x="272" y="587" text-anchor="middle" font-size="23" font-weight="700" fill="#087C94">3</text>
    <text x="320" y="574" font-size="23" font-weight="700">Before every upgrade opens data:</text>
    <text x="320" y="619" font-size="22">Compare the expected layout</text>
    <text x="320" y="651" font-size="22">with the remembered layout</text>

    <path d="M600 700V746H324V798" fill="none" stroke="#218B70" stroke-width="2.5" marker-end="url(#safe-arrow)"/>
    <path d="M600 746H876V798" fill="none" stroke="#C64535" stroke-width="2.5" marker-end="url(#stop-arrow)"/>
    <circle cx="600" cy="746" r="5" fill="#102B50"/>
    <rect x="292" y="730" width="82" height="32" rx="16" fill="#F7FAFD"/>
    <text x="333" y="752" text-anchor="middle" font-size="18" font-weight="700" fill="#20765E">Same</text>
    <rect x="812" y="730" width="128" height="32" rx="16" fill="#F7FAFD"/>
    <text x="876" y="752" text-anchor="middle" font-size="18" font-weight="700" fill="#A23B2F">Different</text>

    <rect x="84" y="814" width="480" height="130" rx="18" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
    <circle cx="132" cy="866" r="20" fill="#218B70"/>
    <path d="M122 866L129 873L142 858" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="171" y="875" font-size="27" font-weight="700" fill="#20765E">Open safely</text>

    <rect x="636" y="814" width="480" height="130" rx="18" fill="#FFF4F1" stroke="#EDB6AD" stroke-width="1.5"/>
    <path d="M684 846L703 854V871C703 884 694 894 684 899C674 894 665 884 665 871V854Z" fill="#C64535"/>
    <path d="M676 871H692" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="723" y="863" font-size="27" font-weight="700" fill="#A23B2F">Stop</text>
    <text x="723" y="900" font-size="21" fill="#6B4C48">Report the conflict</text>
  </g>
</svg>
