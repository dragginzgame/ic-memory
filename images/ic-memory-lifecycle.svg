<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
  <title id="title">ic-memory validates before opening stores</title>
  <desc id="desc">A new application version declares its stores and locations. ic-memory compares these declarations with the saved allocation history. A compatible layout publishes permission, then opens stores. A conflict returns an error and opens nothing. Validation happens before any store opens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
    <marker id="safe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#218B70"/></marker>
    <marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C64535"/></marker>
  </defs>
  <rect width="1200" height="1150" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC MEMORY · HOW IT WORKS</text>
    <text x="56" y="107" font-size="34" font-weight="700">Validate first. Open stores afterwards.</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Every declared storage location is checked before opening is permitted.</text>

    <rect x="216" y="188" width="768" height="108" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <circle cx="272" cy="242" r="25" fill="#DDF6FA"/>
    <text x="272" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#087C94">1</text>
    <text x="320" y="251" font-size="26" font-weight="700">New application version</text>

    <path d="M600 299V344" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="358" width="768" height="108" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <circle cx="272" cy="412" r="25" fill="#DDF6FA"/>
    <text x="272" y="420" text-anchor="middle" font-size="23" font-weight="700" fill="#087C94">2</text>
    <text x="320" y="421" font-size="26" font-weight="700">Declared stores and locations</text>

    <path d="M600 469V514" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="528" width="768" height="170" rx="18" fill="white" stroke="#009DBD" stroke-width="2"/>
    <circle cx="272" cy="579" r="25" fill="#DDF6FA"/>
    <text x="272" y="587" text-anchor="middle" font-size="23" font-weight="700" fill="#087C94">3</text>
    <text x="320" y="574" font-size="23" font-weight="700">Compare with saved allocation history</text>
    <text x="320" y="619" font-size="22">Validation happens here.</text>
    <text x="320" y="651" font-size="22">No stores have been opened.</text>

    <path d="M600 700V746H324V798" fill="none" stroke="#218B70" stroke-width="2.5" marker-end="url(#safe-arrow)"/>
    <path d="M600 746H876V798" fill="none" stroke="#C64535" stroke-width="2.5" marker-end="url(#stop-arrow)"/>
    <circle cx="600" cy="746" r="5" fill="#102B50"/>
    <rect x="257" y="730" width="134" height="32" rx="16" fill="#F7FAFD"/>
    <text x="324" y="752" text-anchor="middle" font-size="18" font-weight="700" fill="#20765E">Compatible</text>
    <rect x="820" y="730" width="112" height="32" rx="16" fill="#F7FAFD"/>
    <text x="876" y="752" text-anchor="middle" font-size="18" font-weight="700" fill="#A23B2F">Conflict</text>

    <rect x="84" y="814" width="480" height="88" rx="18" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
    <circle cx="132" cy="858" r="20" fill="#218B70"/>
    <path d="M122 858L129 865L142 850" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="171" y="867" font-size="26" font-weight="700" fill="#20765E">Publish permission</text>
    <path d="M324 905V936" fill="none" stroke="#218B70" stroke-width="2.5" marker-end="url(#safe-arrow)"/>
    <rect x="84" y="950" width="480" height="82" rx="18" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
    <text x="324" y="1001" text-anchor="middle" font-size="27" font-weight="700" fill="#20765E">Open stores</text>

    <rect x="636" y="814" width="480" height="88" rx="18" fill="#FFF4F1" stroke="#EDB6AD" stroke-width="1.5"/>
    <path d="M684 831L703 839V856C703 869 694 879 684 884C674 879 665 869 665 856V839Z" fill="#C64535"/>
    <path d="M676 856H692" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="723" y="867" font-size="26" font-weight="700" fill="#A23B2F">Return an error</text>
    <path d="M876 905V936" fill="none" stroke="#C64535" stroke-width="2.5" marker-end="url(#stop-arrow)"/>
    <rect x="636" y="950" width="480" height="82" rx="18" fill="#FFF4F1" stroke="#EDB6AD" stroke-width="1.5"/>
    <text x="876" y="1001" text-anchor="middle" font-size="27" font-weight="700" fill="#A23B2F">Open nothing</text>

    <text x="600" y="1100" text-anchor="middle" font-size="20" font-weight="700" fill="#53718F">Validation before opening — on both paths.</text>
  </g>
</svg>
