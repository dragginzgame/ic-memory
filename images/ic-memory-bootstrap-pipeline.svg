<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
<title id="title">IC Memory bootstrap safety pipeline</title>
<desc id="desc">Recover, prepare, resolve, validate, persist, publish, then open. Memory is opened only after validation and persistence, and after permission is published. The diagram presents the required sequence, not alternate paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker></defs>
<rect width="1600" height="590" fill="#F7FAFD"/>
<g font-family="Inter, Arial, sans-serif" fill="#102B50">
  <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC MEMORY · BOOTSTRAP SAFETY</text>
  <text x="56" y="107" font-size="34" font-weight="700">Validate and persist before opening memory.</text>
  <text x="56" y="143" font-size="19" fill="#53718F">One ordered pipeline, from recovery to authorised access.</text>
  <rect x="56" y="182" width="1488" height="262" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
  <circle cx="170" cy="233" r="17" fill="#EDF3F9"/><text x="170" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#53718F">1</text>
  <rect x="80" y="266" width="180" height="86" rx="14" fill="#EDF3F9" stroke="#A9BED3" stroke-width="1.5"/>
  <text x="170" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#102B50">Recover</text>
  <text x="170" y="384" text-anchor="middle" font-size="16" fill="#53718F">Recovered state</text>
  <path d="M267 309H281" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="380" cy="233" r="17" fill="#EDF3F9"/><text x="380" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#53718F">2</text>
  <rect x="290" y="266" width="180" height="86" rx="14" fill="#EDF3F9" stroke="#A9BED3" stroke-width="1.5"/>
  <text x="380" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#102B50">Prepare</text>
  <text x="380" y="384" text-anchor="middle" font-size="16" fill="#53718F">Bootstrap inputs</text>
  <path d="M477 309H491" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="590" cy="233" r="17" fill="#EDF3F9"/><text x="590" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#53718F">3</text>
  <rect x="500" y="266" width="180" height="86" rx="14" fill="#EDF3F9" stroke="#A9BED3" stroke-width="1.5"/>
  <text x="590" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#102B50">Resolve</text>
  <text x="590" y="384" text-anchor="middle" font-size="16" fill="#53718F">Storage layout</text>
  <path d="M687 309H701" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="800" cy="233" r="17" fill="#DDF6FA"/><text x="800" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#087C94">4</text>
  <rect x="710" y="266" width="180" height="86" rx="14" fill="#DDF6FA" stroke="#009DBD" stroke-width="2"/>
  <text x="800" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#087C94">Validate</text>
  <text x="800" y="384" text-anchor="middle" font-size="16" fill="#53718F">Check the layout</text>
  <path d="M897 309H911" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="1010" cy="233" r="17" fill="#EEE8FB"/><text x="1010" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#7354C6">5</text>
  <rect x="920" y="266" width="180" height="86" rx="14" fill="#EEE8FB" stroke="#7354C6" stroke-width="2"/>
  <text x="1010" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#7354C6">Persist</text>
  <text x="1010" y="384" text-anchor="middle" font-size="16" fill="#53718F">Save the layout</text>
  <path d="M1107 309H1121" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="1220" cy="233" r="17" fill="#EDF3F9"/><text x="1220" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#53718F">6</text>
  <rect x="1130" y="266" width="180" height="86" rx="14" fill="#EDF3F9" stroke="#A9BED3" stroke-width="1.5"/>
  <text x="1220" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#53718F">Publish</text>
  <text x="1220" y="384" text-anchor="middle" font-size="16" fill="#53718F">Publish permission</text>
  <path d="M1317 309H1331" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="1430" cy="233" r="17" fill="#EAF7F1"/><text x="1430" y="239" text-anchor="middle" font-size="17" font-weight="700" fill="#20765E">7</text>
  <rect x="1340" y="266" width="180" height="86" rx="14" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
  <text x="1430" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#20765E">Open</text>
  <text x="1430" y="384" text-anchor="middle" font-size="16" fill="#53718F">Open memory</text>
  <rect x="56" y="472" width="1488" height="72" rx="16" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
  <path d="M91 492L105 498V509C105 518 99 525 91 529C83 525 77 518 77 509V498Z" fill="#20765E"/>
  <path d="M84 509L89 514L99 502" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="516" font-size="23" font-weight="700" fill="#20765E">Memory opens only after validation, persistence and publication.</text>
</g>
</svg>
