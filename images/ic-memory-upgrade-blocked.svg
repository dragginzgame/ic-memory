 <use href="#orders-folder" x="730" y="435"/><text x="802" y="558" font-size="19" font-weight="700" text-anchor="middle">Orders</text>
 <g stroke-width="3" fill="none">
  <path d="M260 348H433" stroke="#009DBD" marker-end="url(#arrow-cyan)"/>
  <path d="M260 491H433" stroke="#7354C6" marker-end="url(#arrow-violet)"/>
