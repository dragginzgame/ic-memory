  <path d="M455 474H637" stroke="#7354C6" stroke-width="1.5"/>
  <circle cx="471" cy="463" r="3" fill="#7354C6"/><circle cx="482" cy="463" r="3" fill="#7354C6"/>
  <text x="546" y="509" font-size="20" font-weight="700" text-anchor="middle">Storage 101</text>
  <rect x="1114" y="308" width="182" height="82" rx="11" fill="#F0FBFD" stroke="#009DBD" stroke-width="2"/>
