 <g transform="translate(95 639)"><path d="M35 0 62 11V34C62 53 49 67 35 74C21 67 8 53 8 34V11Z" fill="#C64535"/><path d="M21 37H49" stroke="white" stroke-width="6" stroke-linecap="round"/></g>
 <text x="183" y="653" font-size="13" letter-spacing="1.5" font-weight="700" fill="#A23B2F">IC-MEMORY DETECTS THE SWAP</text>
 <text x="183" y="692" font-size="31" font-weight="700" fill="#A23B2F">Upgrade blocked</text>
 <text x="183" y="724" font-size="19" fill="#6B4C48">Neither store is opened with the wrong storage assignment.</text>
 <text x="1336" y="790" font-size="13" text-anchor="end" fill="#71859A">Users → 100 · Orders → 101</text>
</g>
</svg>
