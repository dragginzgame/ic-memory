<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">IC Memory: omitted, restored and retired stores</title>
<desc id="desc">An active store may be omitted. An omitted store still owns its slot, cannot be opened normally and may be selected during bootstrap for restoration. Retirement is different: a retired store leaves a permanent tombstone, and its key and slot can never be reused. No transition from retirement to restoration is shown.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
  <marker id="restore-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#218B70"/></marker>
  <marker id="retire-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C64535"/></marker>
</defs>
<rect width="1400" height="900" fill="#F7FAFD"/>
<g font-family="Inter, Arial, sans-serif" fill="#102B50">
  <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC MEMORY · STORE LIFECYCLE</text>
  <text x="56" y="107" font-size="34" font-weight="700">Omitted is recoverable. Retired is permanent.</text>
  <text x="56" y="143" font-size="19" fill="#53718F">Omission preserves ownership; retirement permanently prevents reuse.</text>

  <rect x="56" y="182" width="1288" height="358" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
  <text x="88" y="222" font-size="14" font-weight="700" letter-spacing="1.5" fill="#53718F">OMISSION AND RESTORATION</text>

  <rect x="88" y="282" width="210" height="90" rx="16" fill="#DDF6FA" stroke="#009DBD" stroke-width="1.5"/>
  <text x="193" y="338" text-anchor="middle" font-size="27" font-weight="700" fill="#087C94">Active</text>
  <path d="M310 327H388" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="404" y="260" width="450" height="236" rx="18" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
  <text x="436" y="303" font-size="27" font-weight="700" fill="#7354C6">Omitted</text>
  <path d="M436 322H822" stroke="#C6B7E8" stroke-width="1.5"/>
  <g fill="#7354C6"><circle cx="440" cy="358" r="4"/><circle cx="440" cy="401" r="4"/><circle cx="440" cy="444" r="4"/></g>
  <g font-size="21">
    <text x="460" y="365">Still owns its slot</text>
    <text x="460" y="408">Cannot be opened normally</text>
    <text x="460" y="451">May be selected during bootstrap</text>
  </g>

  <path d="M866 327H1068" fill="none" stroke="#218B70" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#restore-arrow)"/>
  <text x="967" y="280" text-anchor="middle" font-size="17" fill="#20765E">Selected during</text>
  <text x="967" y="303" text-anchor="middle" font-size="17" fill="#20765E">bootstrap</text>
  <rect x="1084" y="282" width="228" height="90" rx="16" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
  <text x="1198" y="338" text-anchor="middle" font-size="27" font-weight="700" fill="#20765E">Restored</text>
  <text x="1198" y="410" text-anchor="middle" font-size="17" fill="#53718F">Previously omitted store</text>

  <rect x="56" y="572" width="1288" height="252" rx="22" fill="#FFF4F1" stroke="#EDB6AD" stroke-width="1.5"/>
  <text x="88" y="612" font-size="14" font-weight="700" letter-spacing="1.5" fill="#A23B2F">PERMANENT RETIREMENT</text>

  <rect x="88" y="650" width="260" height="110" rx="16" fill="white" stroke="#EDB6AD" stroke-width="1.5"/>
  <text x="218" y="716" text-anchor="middle" font-size="27" font-weight="700" fill="#A23B2F">Retired</text>
  <path d="M360 705H444" fill="none" stroke="#C64535" stroke-width="2.5" marker-end="url(#retire-arrow)"/>

  <rect x="460" y="640" width="852" height="140" rx="18" fill="white" stroke="#C64535" stroke-width="2"/>
  <g transform="translate(490 677)" fill="none" stroke="#A23B2F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 50V17Q0 0 20 0Q40 0 40 17V50Z"/>
    <path d="M12 22H28M20 15V30"/>
  </g>
  <text x="556" y="691" font-size="27" font-weight="700" fill="#A23B2F">Permanent tombstone</text>
  <text x="556" y="736" font-size="23">Key and slot can never be reused</text>
</g>
</svg>
